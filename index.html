<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>首爾跨年行程 · 旅伴手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EE;--paper-deep:#EFE5D6;--snow:#FFFFFF;--ink:#14100E;--ink-muted:#5E5850;--line:#DDD2C1;--rosso:#D10000;--on-rosso:#FFFFFF;--rosso-ink:#D10000;--cafe:#A9725A;--on-cafe:#1A0F0A;--evergreen:#073223;--on-evergreen:#F5EFE4;--rainforest:#06795D;--on-rainforest:#FFFFFF;--meadow:#25B899;--on-meadow:#073223;--gold:#E7B04B;--on-gold:#073223;--focus:#D10000;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;--space-24:96px;--space-32:128px;--radius-none:0px;--radius-sm:4px;--radius-md:14px;--radius-pill:999px;--shadow-pop:5px 5px 0 #161412;--shadow-soft:0 12px 32px rgba(22,20,18,0.12);--font-poster:"Anton", "Noto Sans TC", Impact, sans-serif;--font-display:"DM Serif Display", "Noto Serif TC", Georgia, serif;--font-serif-tc:"Noto Serif TC", "Songti TC", serif;--font-sans:"Noto Sans TC", "PingFang TC", system-ui, sans-serif;--font-hand:"Caveat", "Noto Sans TC", cursive;--font-mono:"Space Mono", "Noto Sans TC", ui-monospace, monospace}
/* 旅伴手帳 · Seoul Holiday — component styles. Prefix: tb- */
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.85;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
.tb-pad{padding:var(--space-6)}
.tb-row{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
/* type helpers */
.tb-eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
.tb-poster{font-family:var(--font-poster);text-transform:uppercase;line-height:.88;letter-spacing:-.01em;margin:0}
.tb-display{font-family:var(--font-display);line-height:1;margin:0}
.tb-h-tc{font-family:var(--font-serif-tc);font-weight:900;letter-spacing:.04em;line-height:1.35;margin:0}
.tb-hand{font-family:var(--font-hand);font-weight:600;line-height:1.05}
.tb-mono{font-family:var(--font-mono);font-weight:700}
.tb-mark{background:linear-gradient(transparent 62%,var(--gold) 62%);padding:0 .1em}
/* Button */
.tb-btn{display:inline-flex;align-items:center;gap:var(--space-2);height:48px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:2px solid var(--ink);background:var(--snow);color:var(--ink);font:700 15px/1 var(--font-sans);letter-spacing:.04em;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.tb-btn:hover{transform:translate(-2px,-2px);box-shadow:var(--shadow-pop)}
.tb-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--focus)}
.tb-btn-primary{background:var(--rosso);border-color:var(--ink);color:var(--on-rosso);box-shadow:var(--shadow-pop)}
.tb-btn-primary:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tb-btn-ghost{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:5px}
.tb-btn-sm{height:36px;padding:0 var(--space-4);font-size:13px}
.tb-btn-arrow:after{content:"→";font-family:var(--font-mono)}
/* Tag */
.tb-tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-sm);font:700 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);background:var(--snow);color:var(--ink)}
.tb-tag-rosso{background:var(--rosso);color:var(--on-rosso);border-color:var(--rosso)}
.tb-tag-evergreen{background:var(--evergreen);color:var(--on-evergreen);border-color:var(--evergreen)}
.tb-tag-gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.tb-tag-meadow{background:var(--meadow);color:var(--on-meadow);border-color:var(--meadow)}
/* Card */
.tb-card{background:var(--snow);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-6);position:relative}
.tb-card-pop{box-shadow:var(--shadow-pop)}
.tb-card h3{margin:var(--space-2) 0 var(--space-1);font-family:var(--font-serif-tc);font-weight:900;font-size:22px;letter-spacing:.02em}
.tb-card p{margin:0;color:var(--ink-muted);font-size:14px;line-height:1.75}
.tb-card-photo{padding:0;overflow:hidden}
.tb-card-photo .ph{aspect-ratio:4/3}
.tb-card-photo .bd{padding:var(--space-6)}
/* Color block (section) */
.tb-block{padding:var(--space-12) var(--space-12);border-radius:var(--radius-none)}
.tb-block-rosso{background:var(--rosso);color:var(--on-rosso)}
.tb-block-evergreen{background:var(--evergreen);color:var(--on-evergreen)}
.tb-block-meadow{background:var(--meadow);color:var(--on-meadow)}
.tb-block-gold{background:var(--gold);color:var(--on-gold)}
.tb-block-paper{background:var(--paper-deep);color:var(--ink)}
.tb-block .tb-eyebrow{color:inherit;opacity:.85}
/* Photo placeholder: replace with a real photo */
.tb-photo{position:relative;background:var(--evergreen);color:var(--on-evergreen);overflow:hidden;display:flex;align-items:flex-end;padding:var(--space-4)}
.tb-photo:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
.tb-photo span{position:relative;font:700 11px/1.4 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.tb-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Polaroid */
.tb-polaroid{display:inline-block;background:#fff;padding:12px 12px 44px;box-shadow:var(--shadow-soft);transform:rotate(-3deg);position:relative}
.tb-polaroid .tb-photo{width:220px;height:200px}
.tb-polaroid figcaption{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--font-hand);font-size:24px;color:#161412}
.tb-polaroid:after{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(212,165,55,.75);transform:rotate(2deg)}
/* Navbar */
.tb-nav{display:flex;align-items:center;gap:var(--space-6);height:64px;padding:0 var(--space-12);background:var(--paper);border-bottom:2px solid var(--ink)}
.tb-nav .logo{font-family:var(--font-serif-tc);font-weight:900;font-size:20px;letter-spacing:.06em}
.tb-nav .logo b{color:var(--rosso-ink)}
.tb-nav .logo i{font-family:var(--font-hand);font-style:normal;font-size:20px;color:var(--ink-muted);margin-left:6px}
.tb-nav a.it{font:700 14px/1 var(--font-sans);color:var(--ink);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.tb-nav a.it small{display:block;font:700 9px/1 var(--font-mono);letter-spacing:.2em;color:var(--ink-muted);margin-top:4px}
.tb-nav a.it.on{border-color:var(--rosso)}
.tb-nav .sp{flex:1}
.tb-tabbar{display:flex;background:var(--ink);color:var(--paper);border-radius:var(--radius-pill);padding:6px;gap:4px;width:max-content}
.tb-tabbar a{color:inherit;text-decoration:none;font:700 12px/1 var(--font-sans);padding:10px 14px;border-radius:var(--radius-pill)}
.tb-tabbar a.on{background:var(--rosso);color:var(--on-rosso)}
/* Form */
.tb-field{display:block;margin-bottom:var(--space-4)}
.tb-field>span{display:flex;justify-content:space-between;font:700 13px/1.4 var(--font-sans);margin-bottom:6px}
.tb-field>span em{font:700 10px/1.4 var(--font-mono);letter-spacing:.16em;color:var(--ink-muted);font-style:normal;text-transform:uppercase}
.tb-input{width:100%;box-sizing:border-box;height:48px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--snow);padding:0 14px;font:16px var(--font-sans);color:var(--ink)}
.tb-input:focus{outline:none;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--focus)}
.tb-input::placeholder{color:var(--ink-muted)}
.tb-hint{font-size:12px;color:var(--ink-muted);margin-top:4px}
/* Footer */
.tb-footer{background:var(--ink);color:var(--paper);padding:var(--space-16) var(--space-12) var(--space-8)}
.tb-footer .big{font-family:var(--font-poster);font-size:72px;line-height:.9;text-transform:uppercase;margin:0}
.tb-footer .big span{color:var(--gold)}
.tb-footer .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8);margin-top:var(--space-12);font-size:14px}
.tb-footer .cols b{display:block;font:700 11px/1 var(--font-mono);letter-spacing:.2em;color:var(--gold);margin-bottom:var(--space-3)}
.tb-footer .legal{margin-top:var(--space-12);padding-top:var(--space-4);border-top:1px solid rgba(245,239,228,.25);font:12px var(--font-mono);opacity:.7;display:flex;justify-content:space-between}
/* ---- Editorial devices (from the Busan zine) ---- */
.tb-masthead{position:relative;border:1.5px solid currentColor;padding:var(--space-8)}
.tb-masthead .issue{font:700 12px/1 var(--font-mono);letter-spacing:.32em;text-transform:uppercase;text-align:center}
.tb-arch{border-radius:999px 999px 0 0;overflow:hidden}
.tb-vert{writing-mode:vertical-rl;font:700 12px/1 var(--font-mono);letter-spacing:.3em;text-transform:uppercase}
.tb-arrowbox{display:inline-grid;place-items:center;width:36px;height:36px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font:700 16px/1 var(--font-mono)}
.tb-arrowbox:hover{background:var(--ink);color:var(--paper)}
.tb-torn{clip-path:polygon(0 0,100% 0,100% 92%,96% 96%,91% 91%,86% 97%,80% 93%,74% 98%,68% 92%,61% 97%,55% 92%,49% 98%,43% 93%,37% 97%,31% 91%,25% 96%,19% 92%,13% 98%,7% 93%,0 97%)}
.tb-script-over{position:relative;display:inline-block}
.tb-script-over .s{position:absolute;left:12%;top:-.55em;font-family:var(--font-hand);font-weight:600;color:var(--rainforest);transform:rotate(-8deg);font-size:.75em;white-space:nowrap}
.tb-tag-cafe{background:var(--cafe);color:var(--on-cafe);border-color:var(--cafe)}
.tb-tag-rainforest{background:var(--rainforest);color:var(--on-rainforest);border-color:var(--rainforest)}
.tb-block-cafe{background:var(--cafe);color:var(--on-cafe)}
.tb-block-rainforest{background:var(--rainforest);color:var(--on-rainforest)}
/* ---- Split bill ---- */
.tb-split-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--line)}
.tb-split-amt{font:400 28px/1 var(--font-poster);text-align:right}
.tb-split-amt small{display:block;font:700 11px/1.6 var(--font-mono);color:var(--ink-muted);letter-spacing:.08em}
.tb-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius-pill);border:1.5px solid var(--ink);background:var(--snow);font:700 14px/1 var(--font-sans);cursor:pointer}
.tb-chip.on{background:var(--evergreen);color:var(--on-evergreen);border-color:var(--evergreen)}
.tb-seg{display:inline-flex;border:2px solid var(--ink);border-radius:var(--radius-pill);overflow:hidden}
.tb-seg button{border:0;background:var(--snow);color:var(--ink);font:700 13px/1 var(--font-mono);padding:12px 16px;cursor:pointer;letter-spacing:.08em}
.tb-seg button.on{background:var(--ink);color:var(--paper)}

/* ---- page layout utilities (canvas) ---- */
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--space-12)}
.sec{padding:var(--space-24) 0}
.marquee{background:var(--rosso);color:var(--on-rosso);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);overflow:hidden;white-space:nowrap}
.marquee .track{display:inline-flex;gap:28px;padding:14px 0;font:400 28px/1 var(--font-poster);text-transform:uppercase;letter-spacing:.02em;animation:tb-mq 28s linear infinite}
.marquee .track i{font-style:normal;color:var(--gold)}
@keyframes tb-mq{to{transform:translateX(-50%)}}
.hero{position:relative;min-height:760px;background:#062419;color:#F5EFE4;overflow:hidden}
.hero .sky{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,17,.15) 0%,rgba(11,20,17,.55) 70%,rgba(11,20,17,.9) 100%)}
.snow{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#fff,transparent),radial-gradient(2px 2px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 60px 210px,#fff,transparent),radial-gradient(1.5px 1.5px at 170px 250px,#fff,transparent);background-size:240px 280px;opacity:.55;animation:tb-snow 18s linear infinite}
@keyframes tb-snow{to{background-position:40px 280px}}
@media (prefers-reduced-motion:reduce){.marquee .track,.snow{animation:none}}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--snow);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius-md);overflow:hidden}
.ticket .main{padding:var(--space-8)}
.ticket .stub{width:180px;border-left:2px dashed var(--ink);padding:var(--space-8) var(--space-6);background:var(--paper-deep);display:flex;flex-direction:column;justify-content:space-between}
.ap{font:400 64px/1 var(--font-poster);letter-spacing:.02em}
.kv-mono{font:700 12px/1.5 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--space-8);padding:var(--space-8) 0;border-top:2px solid var(--ink)}
.tl-time{font:400 44px/1 var(--font-poster);letter-spacing:.01em}
.place-chip{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1.5px solid var(--ink);border-radius:var(--radius-md);background:var(--snow)}
.place-chip .n{font:400 30px/1 var(--font-poster);color:var(--rosso)}

/* ---- app layer ---- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh}
a{color:var(--rosso-ink)}
button{font-family:inherit}
img{max-width:100%}
.tb-nav{position:sticky;top:0;z-index:30;padding:0 32px}
.tb-nav .logo{cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.tb-nav a.it{cursor:pointer;white-space:nowrap}
.tb-nav .navlinks{display:flex;gap:22px;align-items:center}
.wrap{padding:0 32px}
.sec{padding:88px 0}
.hero{min-height:auto}
.stars{position:absolute;inset:0;pointer-events:none}
.stars .star{position:absolute;border-radius:50%;background:#FFF8E1;box-shadow:0 0 6px 1px rgba(255,236,170,.75);animation:tb-twinkle 3s ease-in-out infinite}
.stars .star.big:before,.stars .star.big:after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,244,210,.85);transform:translate(-50%,-50%)}
.stars .star.big:before{width:18px;height:1px}.stars .star.big:after{width:1px;height:18px}
@keyframes tb-twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.flakes{position:absolute;inset:-300px 0 0 0;pointer-events:none;background-repeat:repeat}
.flakes-far{background-image:radial-gradient(1.5px 1.5px at 20px 40px,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 110px 160px,rgba(255,255,255,.6),transparent 60%),radial-gradient(1.5px 1.5px at 190px 90px,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 70px 250px,rgba(255,255,255,.5),transparent 60%);background-size:220px 300px;animation:tb-fall 26s linear infinite}
.flakes-mid{background-image:radial-gradient(2.5px 2.5px at 50px 60px,rgba(255,255,255,.85),transparent 60%),radial-gradient(2px 2px at 170px 200px,rgba(255,255,255,.8),transparent 60%),radial-gradient(2.5px 2.5px at 260px 120px,rgba(255,255,255,.75),transparent 60%);background-size:320px 300px;animation:tb-fall 16s linear infinite}
.flakes-near{background-image:radial-gradient(3.5px 3.5px at 80px 100px,#fff,transparent 60%),radial-gradient(3px 3px at 330px 240px,rgba(255,255,255,.9),transparent 60%);background-size:460px 300px;animation:tb-fall-sway 10s linear infinite;opacity:.9}
@keyframes tb-fall{to{transform:translateY(300px)}}
@keyframes tb-fall-sway{0%{transform:translate(0,0)}25%{transform:translate(14px,75px)}50%{transform:translate(0,150px)}75%{transform:translate(-14px,225px)}100%{transform:translate(0,300px)}}
@media (prefers-reduced-motion:reduce){.stars .star,.flakes{animation:none}}
.tb-photo.has-img:before{display:none}
.tb-photo.has-img span{display:none}
.tb-photo img{z-index:0}
.tb-photo span{z-index:1}
.photo-edit{position:absolute;right:8px;top:8px;z-index:3;height:30px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);background:rgba(255,255,255,.92);font:700 11px/1 var(--font-sans);cursor:pointer}
.edit-btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;height:30px;padding:0 12px;font:700 12px/1 var(--font-sans);cursor:pointer;color:inherit}
.edit-btn.light{border-color:currentColor}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.blocks4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.blocks4 .tb-block{padding:40px 32px;text-decoration:none}
.wx{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.wx>div{border:2px solid var(--on-meadow);padding:18px}
.wx>div.trip{background:#F5EFE4}
.ticket .stub{width:200px}
.tl-row .flow{display:flow-root}
.stop-photo{float:right;width:250px;height:190px;margin:2px 0 10px 18px}
.picks{margin-top:14px;padding:12px 16px;background:var(--paper-deep);font-size:14px}
.picks .q{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.picks .q:hover{color:var(--rosso-ink)}
.day-main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:48px}
.day-aside{position:sticky;top:150px;align-self:start;display:grid;gap:16px}
.daytabs{background:var(--ink);position:sticky;top:64px;z-index:20}
.daytabs .dt-in{display:flex;gap:6px;padding-top:12px;padding-bottom:12px;overflow-x:auto}
.daytabs button{flex:none;border:1px solid rgba(245,239,228,.35);background:transparent;color:#F5EFE4;font:700 12px/1 var(--font-mono);padding:10px 14px;border-radius:999px;cursor:pointer;letter-spacing:.06em}
.daytabs button.on{background:var(--rosso);border-color:var(--rosso)}
.near-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.near-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.place-chip{text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}
.place-chip.on{box-shadow:var(--shadow-pop)}
.itin-art{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border-top:2px solid var(--ink)}
.itin-art .ph{min-height:520px;position:relative}
.itin-art .tx{padding:56px 64px;display:flex;flex-direction:column;justify-content:center}
.itin-art.rev .ph{order:2}
.itin-art ul{list-style:none;margin:0 0 28px;padding:0;border-top:2px solid var(--ink)}
.itin-art li{padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.split3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.doc-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border:1.5px solid var(--ink);background:var(--snow)}
.lv{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:4px;font:700 12px/1 var(--font-mono);letter-spacing:.08em;flex:none;border:1.5px solid var(--ink)}
.lv.ok{background:var(--evergreen);color:var(--on-evergreen);border-color:var(--evergreen)}
.lv.declare,.lv.info{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.lv.ban{background:var(--rosso);color:#fff;border-color:var(--rosso)}
.verdict{border:2px solid var(--ink);border-radius:14px;padding:24px;background:var(--snow)}
.verdict.ok{background:#DDF3EA}.verdict.declare{background:#FBEFD2}.verdict.banned{background:#FBE0DD}
.drop{display:block;border:2px dashed var(--ink);border-radius:14px;padding:28px;text-align:center;cursor:pointer;background:var(--snow)}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.thumbs img{width:76px;height:76px;object-fit:cover;border:1.5px solid var(--ink)}
.picker-card{display:flex;gap:16px;align-items:center;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.empty{padding:28px;border:1.5px dashed var(--ink);text-align:center;color:var(--ink-muted);font-size:14px}

async function write(path, data, mode='set'){
  if (!S.db) { toast('目前無法儲存（未登入或無資料權限）'); throw new Error('nodb'); }
  try {
    const ref = S.db.doc(path);
    if (mode === 'update') await ref.update(data); else if (mode === 'delete') await ref.delete(); else await ref.set(data);
  } catch (e) {
    if (e && e.code === 'invalid_argument') { S.canWrite = false; render(); toast('你目前只有檢視權限，無法修改資料'); }
    else if (e && e.code === 'quota_exceeded') toast('資料空間已滿，請刪除部分舊資料');
    else toast('儲存失敗，請稍後再試');
    throw e;
  }
}

const stripId = o => { const c = {...o}; delete c.id; return c; };
function modal(title, inner, opts={}){
  const m = $('#modal');
  m.innerHTML = `<div class="modal" data-act="mbg"><div class="sheet" style="${opts.wide?'max-width:760px':''}"><div class="hd"><h3>${title}</h3><button class="x" data-act="mclose">✕</button></div><div id="mbody">${inner}</div></div></div>`;
  document.body.style.overflow='hidden';
}
function closeModal(){ $('#modal').innerHTML=''; document.body.style.overflow=''; }
function formHTML(fields, v={}){
  return fields.map(f=>{
    const val = v[f.k] ?? f.def ?? '';
    let input;
    if (f.type==='textarea') input = `<textarea class="in" name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
    else if (f.type==='select') input = `<select class="in" name="${f.k}">${f.options.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(val)===String(ov)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
    else input = `<input class="in" name="${f.k}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
    return `<label class="f"><span>${esc(f.label)}${f.req?' *':''}</span>${input}${f.hint?`<em>${esc(f.hint)}</em>`:''}</label>`;
  }).join('');
}
function formModal(title, fields, values, onSave, opts={}){
  modal(title, `<form id="mf">${opts.top||''}${formHTML(fields, values)}<div class="row between" style="margin-top:6px"><div>${opts.del?`<button type="button" class="btn ghost" id="mfdel" style="color:var(--bad)">🗑 刪除</button>`:''}</div><div class="row">${opts.extra||''}<button type="button" class="btn" data-act="mclose">取消</button><button class="btn pri" type="submit" id="mfsave">儲存</button></div></div></form>`);
  $('#mf').addEventListener('submit', async e => {
    e.preventDefault(); const fd = new FormData(e.target); const vals = {}; fields.forEach(f=>vals[f.k]=(fd.get(f.k)??'').toString().trim());
    const b = $('#mfsave'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 儲存中';
    try { await onSave(vals); closeModal(); toast('已儲存，旅伴會同步看到'); } catch(err){ b.disabled=false; b.textContent='儲存'; if (err && err.userMsg) toast(err.userMsg); }
  });
  if (opts.del) $('#mfdel').addEventListener('click', ()=>confirmBox(opts.delMsg||'確定要刪除嗎？此動作無法復原。', async()=>{ await opts.del(); closeModal(); toast('已刪除'); }));
  if (opts.after) opts.after();
}
function confirmDelete(msg, onYes){
  modal('確認刪除', `<p>${esc(msg)}</p><label class="f"><span>請輸入大寫 DELETE 才能刪除</span><input class="in" id="cfdel" autocomplete="off" autocapitalize="characters" placeholder="DELETE"></label><div class="row" style="justify-content:flex-end"><button class="btn" id="cfno">取消</button><button class="btn pri" id="cfyes" disabled>刪除</button></div>`);
  const i = $('#cfdel'), y = $('#cfyes');
  i.oninput = ()=>{ y.disabled = i.value.trim() !== 'DELETE'; };
  i.focus();
  $('#cfno').onclick = ()=>closeModal();
  y.onclick = async ()=>{ if (i.value.trim()!=='DELETE') return; y.disabled = true; try{ await onYes(); toast('已刪除'); }catch(e){} closeModal(); };
}
function confirmBox(msg, onYes){
  const prev = $('#modal').innerHTML;
  modal('請確認', `<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cfno">取消</button><button class="btn pri" id="cfyes">確定</button></div>`);
  $('#cfno').onclick = ()=>closeModal();
  $('#cfyes').onclick = async ()=>{ $('#cfyes').disabled = true; try{ await onYes(); }catch(e){} closeModal(); };
}

/* ============ AI (sample) ============ */
async function ask(prompt, opts={}){
  const s = await getCap('sample');
  if (!s) { const e = new Error('nosample'); e.userMsg = '此檢視無法使用 AI 功能（需在 Claude 中開啟並同意使用）'; throw e; }
  try {
    const res = await s(prompt + '\n\n只輸出 JSON，不要任何其他文字或 markdown 標記。', {modelTier: opts.tier || 'default', cache:false, ...(opts.images?{images:opts.images}:{})});
    const txt = (res.text||'').replace(/^```(json)?/m,'').replace(/```\s*$/m,'').trim();
    const a = txt.indexOf(txt.trim().startsWith('[')?'[':'{'); return JSON.parse(txt.slice(a));
  } catch (e) {
    const er = new Error('ai'); er.userMsg = e && e.code==='rate_limited' ? 'AI 使用次數暫時達上限，請稍後再試' : (e && e.code==='not_granted' ? '未授權使用 AI 功能' : 'AI 分析失敗，請再試一次'); throw er;
  }
}

/* ============ uploads ============ */
function pickFile(accept, multiple){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.multiple=!!multiple; i.onchange=()=>res([...i.files]); i.click(); }); }
async function uploadAsset(file){
  const a = await getCap('assets');
  if (!a) { const e=new Error('noassets'); e.userMsg='只有行程編輯者可以上傳檔案'; throw e; }
  if (file.size > 20*1024*1024) { const e=new Error('big'); e.userMsg='檔案超過 20MB'; throw e; }
  try { return await a.upload(file); } catch(err){ const e=new Error('up'); e.userMsg='上傳失敗：'+((err&&err.message)||''); throw e; }
}
async function addPhoto(stopId){
  const files = await pickFile('image/*', true); if (!files.length) return;

  try { const ups = []; for (const f of files.slice(0,6)) { const r = await uploadAsset(f); ups.push({id:r.id}); }

function keywordCheck(){
  const sv = S.sv, n = (sv.name||'').trim();
  if (!n) return toast('請輸入商品名稱或包裝上的成分');
  const MEAT = ['肉','豬','牛','雞','鴨','羊','火腿','香腸','培根','臘','骨湯','高湯','豬油','돼지','소고기','쇠고기','닭','오리','햄','소시지','베이컨','육','돈','pork','beef','chicken','ham','bacon','sausage'];
  const FRESH = ['新鮮','鮮果','水果','蘋果','草莓','橘','柑','梨','葡萄','柿','蔬菜','生菜','種子','帶土','鮮人蔘','과일','딸기','귤','배','사과','채소','씨앗'];
  const DECL = ['米','蓮子','椰棗','無花果','人蔘','人參','中藥','蛋','乳','奶','起司','쌀','인삼','홍삼','계란','우유','치즈'];
  const hit = a => a.filter(k=>n.toLowerCase().includes(k.toLowerCase()));
  const m = hit(MEAT), f = hit(FRESH), d = hit(DECL);
  let r;
  if (m.length) r = {verdict:'banned', risky:m, reason:'名稱或成分中出現肉類相關字詞，含肉製品不可攜帶。', advice:'改買不含肉的版本；不確定就在入境時主動申報。'};
  else if (f.length) r = {verdict:'banned', risky:f, reason:'疑似新鮮蔬果或植物，通常禁止攜帶。', advice:'加工完成（乾燥、醃漬、果醬）的產品才可以帶。'};
  else if (d.length) r = {verdict:'declare', risky:d, reason:'含有可能需要檢疫或有條件限制的品項。', advice:'對照下方規定；不確定就在入境時主動申報。'};
  else r = {verdict:'unknown', risky:[], reason:'沒有找到明顯的禁帶關鍵字，但這只是文字比對，無法讀取完整成分。', advice:'請對照下方規定確認成分表，特別留意肉粉、肉萃取物、骨湯粉等字樣。'};
  r.product = n; sv.result = r; render();
}

/* ============ sky / hero art ============ */
function rnd(seed){ let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function skySVG(w, h, seed){
  const r = rnd(seed||7); let x = 0, out = `<rect width="${w}" height="${h}" fill="#062419"/><circle cx="${Math.round(w*.18)}" cy="${Math.round(h*.2)}" r="46" fill="#F5EFE4" opacity=".9"/>`;
  out += `<path d="M${Math.round(w*.48)} ${h} Q${Math.round(w*.68)} ${Math.round(h*.42)} ${Math.round(w*.9)} ${h} Z" fill="#041a12"/>`;
  const fills = ['#08301f','#0a3a2a','#0c4231'];
  while (x < w) {
    const bw = 44 + Math.floor(r()*64), bh = Math.round(h*(.16 + r()*.3)), y = h - bh, f = fills[Math.floor(r()*3)];
    out += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${f}"/>`;
    for (let wy = y + 14; wy < h - 10; wy += 22) for (let wx = x + 8; wx < x + bw - 10; wx += 18) if (r() < .32) out += `<rect x="${wx}" y="${wy}" width="6" height="8" fill="#E7B04B" opacity="${[.5,.8,.95][Math.floor(r()*3)]}"/>`;
    x += bw + Math.floor(r()*6);
  }
  return `<svg class="sky" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">${out}</svg>`;
}
function starsFX(){
  const r = rnd(11); let s = '';
  for (let i=0;i<34;i++){ const big = r()<.18, sz = big?4:(r()<.5?2:3);
    s += `<i class="star${big?' big':''}" style="left:${(r()*100).toFixed(1)}%;top:${(r()*52).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-delay:${(r()*4).toFixed(2)}s;animation-duration:${(2.2+r()*2.3).toFixed(2)}s"></i>`; }
  return `<div class="stars" aria-hidden="true">${s}</div><div class="shade"></div><div class="flakes flakes-far" aria-hidden="true"></div><div class="flakes flakes-mid" aria-hidden="true"></div><div class="flakes flakes-near" aria-hidden="true"></div>`;
}

/* ============ data layer additions ============ */
function openTrip(id){
  if (S.tripId === id) return;
  S.unsubs.forEach(u=>{try{u()}catch(e){}}); S.unsubs = [];
  Object.assign(S, {tripId:id, trip:null, tripLoaded:false, flights:[], transfers:[], days:[], stops:[], visas:[], expenses:[]});
  S.sv = {dir:'back', files:[], name:'', busy:false, result:null};
  S.sp = {item:'', amount:'', cur:'KRW', payer:'', split:null, newMember:'', busy:false};
  NB = {stopId:null, cat:'restaurant', sel:null, busy:false};
  if (S.snap && id) { const P = window.__SNAP__; if (id===P.trip.id) { S.trip = {...P.trip}; S.flights = P.flights.slice(); S.transfers = P.transfers.slice(); S.days = P.days.slice(); S.stops = P.stops.slice().sort(sortStops); S.expenses = (P.expenses||[]).slice(); } S.tripLoaded = true; return; }
  if (!S.db || !id) return;
  const base = 'trips/' + id;
  S.unsubs.push(S.db.doc(base).onSnapshot(d => { S.trip = d.exists ? {id:d.id, ...d.data()} : null; S.tripLoaded = true; render(); }, ()=>{ S.tripLoaded=true; render(); }));
  const sub = (col, key, sorter) => S.unsubs.push(S.db.collection(base + '/' + col).onSnapshot(s => {
    S[key] = s.docs.map(d => ({id:d.id, ...d.data()}));
    if (key==='flights' && window.__SNAP__ && id===window.__SNAP__.trip.id) S.flights.forEach(f=>{ const p=(window.__SNAP__.flights||[]).find(x=>x.id===f.id); if (p && p.gate && !f.gate) { f.gate=p.gate; f.updatedAt=p.updatedAt; f.source=p.source; } });
    if (key==='transfers' && window.__SNAP__ && id===window.__SNAP__.trip.id) S.transfers.forEach(x=>{ const p=(window.__SNAP__.transfers||[]).find(y=>y.id===x.id); if (p) { x.fromGeo=x.fromGeo||p.fromGeo; x.toGeo=x.toGeo||p.toGeo; } });
    if (sorter) S[key].sort(sorter); render();
  }, ()=>{}));
  sub('flights','flights',(a,b)=>(a.date+a.depTime).localeCompare(b.date+b.depTime));
  sub('transfers','transfers',(a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')));
  sub('days','days',(a,b)=>(a.date||'').localeCompare(b.date||''));
  sub('stops','stops',sortStops);
  sub('visas','visas',(a,b)=>(a.person||'').localeCompare(b.person||'','zh-Hant'));
  sub('expenses','expenses',(a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
}

/* ============ routing ============ */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h && S.snap && window.__SNAP__) { history.replaceState(null,'','#'+window.__SNAP__.trip.id); return route(); }
  if (!h) { if (S.tripId) openTrip(null); S.tripId=null; render(); return; }
  const [id, tab] = h.split('--');
  let k = tab || 'home';
  const m = /^day-(\d+)$/.exec(k);
  if (m) { S.dayIdx = Math.max(0, +m[1]-1); k = 'day'; }
  S.tab = PAGES.some(p=>p.k===k) ? k : 'home';
  openTrip(id); render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
function go(id, tab){
  if (!id) { location.hash=''; history.replaceState(null,'',location.pathname+location.search); route(); return; }
  const h = tab==='day' ? `${id}--day-${S.dayIdx+1}` : (tab && tab!=='home' ? `${id}--${tab}` : id);
  if (location.hash.replace(/^#/,'') === h) { route(); return; }
  location.hash = h;
}
function goPage(k){ go(S.tripId, k); }
function goDay(i){ S.dayIdx = i; NB = {stopId:null, cat:'restaurant', sel:null, busy:false}; go(S.tripId, 'day'); }
function todayIdx(){ const t=S.trip; if(!t||!S.days.length) return 0; const td=todayIn(t.tz||'Asia/Seoul'); const i=S.days.findIndex(d=>d.date===td); return i>=0?i:0; }

/* ============ render shell ============ */
function render(){
  const app = $('#app'), top = $('#top'), mt = $('#mtab');
  if (!S.tripId) { top.innerHTML = navHTML(false); mt.innerHTML=''; app.innerHTML = renderPicker(); return; }
  top.innerHTML = navHTML(true);
  mt.innerHTML = `<div class="tb-tabbar">${PAGES.map(p=>`<a class="${S.tab===p.k?'on':''}" data-act="page" data-k="${p.k}">${p.m}</a>`).join('')}</div>`;
  if (!S.tripLoaded) { app.innerHTML = `<div class="wrap" style="padding-top:80px"><div class="empty"><span class="spin"></span> 載入行程中…${S.slow?'<br>連線較慢，資料可能尚未同步。':''}</div></div>`; return; }
  if (!S.trip) { app.innerHTML = `<div class="wrap" style="padding-top:80px"><div class="empty">找不到這個行程。<br><br><button class="tb-btn" data-act="home">回到行程列表</button></div></div>`; return; }
  const keepY = window.scrollY;
  const fn = {home:renderHome, info:renderInfo, itin:renderItin, day:renderDay, split:renderSplit, souvenir:renderSouvenir}[S.tab] || renderHome;
  const ae = document.activeElement, aid = ae && ae.id, pos = ae && ae.selectionStart;
  app.innerHTML = fn() + footer();
  if (aid) { const el = document.getElementById(aid); if (el && el.focus) { el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } }
  if (window.scrollY !== keepY) window.scrollTo(0, keepY);
}

function splitCfg(){ const sp = (isWeb() ? S.webSplit : S.trip.split)||{}; return {members: sp.members||[], rate: Number(sp.rate)||0, rateDate: sp.rateDate||''}; }
function toTwd(e, rate){ const r = Number(e.rate)||rate||0; return e.cur==='TWD' ? Number(e.amount) : (r ? Number(e.amount)/r : 0); }
function splitCalc(){
  const cfg = splitCfg(), bal = {}; cfg.members.forEach(m=>bal[m]={paid:0,owe:0}); let total = 0;
  S.expenses.forEach(e=>{ const v = toTwd(e, cfg.rate); total += v; if (!bal[e.payer]) bal[e.payer]={paid:0,owe:0}; bal[e.payer].paid += v;
    const sp = (e.split||[]).length ? e.split : cfg.members; sp.forEach(m=>{ if(!bal[m]) bal[m]={paid:0,owe:0}; bal[m].owe += v/(sp.length||1); }); });
  const cred=[], debt=[]; Object.entries(bal).forEach(([m,b])=>{ const n=b.paid-b.owe; if(n>0.5) cred.push({m,n}); else if(n<-0.5) debt.push({m,n:-n}); });
  cred.sort((a,b)=>b.n-a.n); debt.sort((a,b)=>b.n-a.n);
  const settle=[]; let i=0,j=0; while(i<debt.length&&j<cred.length){ const x=Math.min(debt[i].n,cred[j].n); if(x>=1) settle.push({from:debt[i].m,to:cred[j].m,amt:x}); debt[i].n-=x; cred[j].n-=x; if(debt[i].n<0.5)i++; if(cred[j].n<0.5)j++; }
  return {cfg, bal, total, settle};
}

async function setPhoto(target){
  const files = await pickFile('image/*', false); if (!files.length) return;
  toast('上傳中…');
  try {
    const r = await uploadAsset(files[0]); const id = r.id; const p = target.split(':');
    if (p[0]==='trip') await write('trips/'+S.tripId, {[p[1]]: id}, 'update');
    else if (p[0]==='hotel') await write('trips/'+S.tripId, {hotel:{...(S.trip.hotel||{}), img:id}}, 'update');
    else if (p[0]==='day') await write(tp('days', p[1]), {[p[2]]: id}, 'update');
    else if (p[0]==='stop') await write(tp('stops', p[1]), {cover: id}, 'update');
    toast('照片已更新，旅伴會同步看到');
  } catch(e){ toast(e.userMsg||'上傳失敗'); }
}

function isWeb(){ return !!window.__WEB__; }
function apiUrl(){ return (window.TRIP_API_URL||'').trim(); }
function splitEditable(){ return isWeb() ? !!apiUrl() && !S.webErr : canEdit(); }
S.webSplit = {members:[], rate:0, rateDate:''}; S.webDocs = null; S.docPin = ''; S.webBusy = false;
try { S.docPin = sessionStorage.getItem('docPin') || ''; } catch(_){}

async function api(action, payload){
  if (!apiUrl()) { const e = new Error('尚未設定後端網址'); e.userMsg = '網站尚未連上後端（config.js 的 TRIP_API_URL）'; throw e; }
  let j;
  try { const r = await fetch(apiUrl(), {method:'POST', body: JSON.stringify(Object.assign({action}, payload||{}))}); j = await r.json(); }
  catch(err){ const e = new Error('network'); e.userMsg = '連線失敗，請確認網路後再試'; throw e; }
  if (!j.ok) { const e = new Error(j.error||'error'); e.userMsg = j.error || '操作失敗'; throw e; }
  return j;
}
function applyWebState(j){
  if (j.split) S.webSplit = j.split;
  if (j.expenses) S.expenses = j.expenses.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  if ('ai' in j) S.webAI = j.ai;
  if ('pinSet' in j) S.webPinSet = j.pinSet;
  if (S.sp.split && !S.sp.split.length) S.sp.split = null;
  S.webErr = false;
}
function typing(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest('#app'); }
async function webRefresh(force){
  if (!apiUrl()) { S.webErr = 'noapi'; return; }
  try { const r = await fetch(apiUrl()); const j = await r.json(); if (j.ok) applyWebState(j); else S.webErr = true; }
  catch(_){ S.webErr = true; }
  if (force || (S.tab==='split' && !typing() && !$('#modal').innerHTML)) render();
}
function startWeb(){
  if (!isWeb()) return;
  webRefresh(true);
  setInterval(()=>{ if (document.visibilityState==='visible') webRefresh(false); }, 20000);
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') webRefresh(false); });
}
async function webDo(action, payload, okMsg){
  try { const j = await api(action, payload); applyWebState(j); if (okMsg) toast(okMsg); render(); return j; }
  catch(e){ toast(e.userMsg||'操作失敗'); throw e; }
}

function fileToB64(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); }); }
async function shrinkImage(file, max){
  try {
    const bmp = await createImageBitmap(file); const s = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r=>c.toBlob(r, 'image/jpeg', .85)); return b || file;
  } catch(_) { return file; }
}
function webDocForm(){
  modal('上傳證件', `<label class="f"><span>旅伴姓名 *</span><input class="in" id="wd_person" placeholder="王小明"></label>
   <label class="f"><span>證件類型</span><input class="in" id="wd_type" placeholder="護照影本／電子入境卡／旅平險…"></label>
   <label class="f"><span>效期（選填）</span><input class="in" id="wd_valid" type="date"></label>
   <label class="f"><span>備註（選填）</span><input class="in" id="wd_note"></label>
   <label class="f"><span>檔案 *（圖片或 PDF，8 MB 內）</span><input class="in" id="wd_file" type="file" accept="image/*,application/pdf" style="padding-top:10px"></label>
   <div class="row" style="justify-content:flex-end"><button class="btn" data-act="mclose">取消</button><button class="btn pri" id="wd_go">上傳</button></div>`);
  $('#wd_go').onclick = async () => {
    const person = $('#wd_person').value.trim(), f = $('#wd_file').files[0];
    if (!person || !f) return toast('請填姓名並選擇檔案');
    const go = $('#wd_go'); go.disabled = true; go.innerHTML = '<span class="spin"></span> 上傳中';
    try {
      const blobF = /^image\//.test(f.type) ? await shrinkImage(f, 2200) : f;
      if (blobF.size > 8*1024*1024) throw Object.assign(new Error(), {userMsg:'檔案太大（上限 8 MB）'});
      const mime = /^image\//.test(f.type) ? 'image/jpeg' : (f.type || 'application/pdf');
      const name = /^image\//.test(f.type) ? f.name.replace(/\.\w+$/, '') + '.jpg' : f.name;
      const j = await api('docUpload', {pin:S.docPin, person, docType:$('#wd_type').value.trim(), validUntil:$('#wd_valid').value, note:$('#wd_note').value.trim(), fileName:name, mime, data: await fileToB64(blobF)});
      S.webDocs = j.docs; closeModal(); toast('已上傳'); render();
    } catch(e){ toast(e.userMsg||'上傳失敗'); go.disabled = false; go.textContent = '上傳'; }
  };
}
function souvenirPrompt(withImg){
  const sv = S.sv, t = S.trip, reg = S.regs[regKey(sv.dir)];
  const regTxt = reg ? (reg.sections||[]).map(sec=>sec.title+'：\n'+(sec.items||[]).map(it=>`- [${it.level}] ${it.t}${it.d?'：'+it.d:''}`).join('\n')).join('\n') : '（無既有法規資料，請依該國一般動植物檢疫與海關規定判斷）';
  const from = sv.dir==='back' ? t.country : t.origin, to = sv.dir==='back' ? t.origin : t.country;
  return `你是${to}入境檢疫與海關法規專家。旅客要把一件商品從「${from}」帶入「${to}」。
${withImg?'附圖是商品包裝與成分標示，請先辨識商品名稱與完整成分（含韓文/日文原文翻譯）。':''}
商品名稱（旅客提供）：${sv.name||'未提供'}
以下是${to}的相關規定重點：
${regTxt}
判斷原則：含任何肉類成分（含肉粉、肉萃取物、豬油、骨湯粉、乾燥肉塊、火腿腸）通常禁止；新鮮蔬果禁止；乳製品、蛋類、植物產品依規定判斷；不確定就給 declare。
請用繁體中文回答，輸出 JSON：{"product":"商品名稱","ingredients":["辨識到的主要成分（中文）"],"risky":["有風險的成分"],"verdict":"ok|declare|banned|unknown","reason":"80 字內判斷理由並引用上述規定","advice":"具體建議（如：主動申報、改買不含肉版本）"}`;
}
async function webSouvenir(){
  const sv = S.sv;
  if (!sv.files.length && !sv.name.trim()) return toast('請先拍照或輸入商品名稱');
  if (!apiUrl()) return keywordCheck();
  sv.busy = true; sv.result = null; render();
  try {
    const images = [];
    for (const f of sv.files) { const b = await shrinkImage(f.blob, 1400); images.push({mime:'image/jpeg', data: await fileToB64(b)}); }
    const j = await api('souvenir', {images, name: sv.name, prompt: souvenirPrompt(images.length>0)});
    sv.result = j.result;
  } catch(e){ toast(e.userMsg||'AI 判讀失敗'); if (/金鑰/.test(e.userMsg||'')) keywordCheck(); }
  sv.busy = false; render();
}

boot();
</script>
